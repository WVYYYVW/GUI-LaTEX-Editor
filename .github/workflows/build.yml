# Windows / macOS のインストーラーを作り、タグの Release に添付するワークフロー。
# 使い方: v で始まるタグ（例: v0.2.0）を push すると実行される。
#        Actions タブから手動実行した場合は、Release ではなく成果物（Artifacts）として保存される。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # Release の作成・ファイルの添付に必要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Electron 本体の取得
        run: node node_modules/electron/install.js

      - name: テスト
        run: npm test

      - name: インストーラーの作成
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # コード署名なし

      - name: 成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Release に添付
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
          generate_release_notes: true
